# Spec delta — operações que este change aplica ao baseline no archive
# (schema: .forge/schemas/spec-delta.schema.json; doc §10.4).
# modify_requirement é SUBSTITUIÇÃO TOTAL — nunca patch parcial.
# Capability nova: squad-orchestration. IDs do spec-delta são REQ-SQUAD-NNN; o mapeamento
# 1:1 com os REQ-NN de requirements.md está em design.md §7.
operations:
  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-001
    content_ref: requirements.md#req-01--flag-squadenabled-e-configuração-da-camada
    requirement:
      id: REQ-SQUAD-001
      title: Flag squad.enabled e configuração da camada
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-001-A
          given: "configuração sem bloco squad"
          when: "o servidor carrega a configuração"
          then: "squad.enabled decodifica false e toda operação da camada falha com mensagem acionável"
        - id: SCN-SQUAD-001-B
          given: "configuração com squad.enabled true"
          when: "um endpoint do grupo squad é chamado"
          then: "o handler executa e nenhum caminho existente muda de comportamento"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-002
    content_ref: requirements.md#req-02--registro-durável-por-geração
    requirement:
      id: REQ-SQUAD-002
      title: Registro durável por geração
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-002-A
          given: "nenhuma geração ativa"
          when: "squad init é executado com treze sessões"
          then: "geração e entradas são gravadas em uma transação e a geração fica active"
        - id: SCN-SQUAD-002-B
          given: "uma geração já active"
          when: "squad init é executado sem replace"
          then: "o comando falha com ConflictError e o registro existente não muda"
        - id: SCN-SQUAD-002-C
          given: "servidor reiniciado sobre o mesmo banco"
          when: "squad status é executado"
          then: "a mesma geração e os mesmos session_id são devolvidos"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-003
    content_ref: requirements.md#req-03--resolução-de-nome-escopada-à-geração-atual
    requirement:
      id: REQ-SQUAD-003
      title: Resolução de nome escopada à geração atual
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-003-A
          given: "um nome que só existe na geração anterior fechada"
          when: "squad send --to resolve esse nome"
          then: "o comando falha nomeando a geração onde o nome existe e instrui --session-id"
        - id: SCN-SQUAD-003-B
          given: "um session_id de geração anterior"
          when: "squad send --session-id é executado"
          then: "a mensagem é enfileirada naquela sessão sem gravá-la na geração atual"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-004
    content_ref: requirements.md#req-04--squad-check-valida-sem-ler-segredo
    requirement:
      id: REQ-SQUAD-004
      title: squad check valida sem ler segredo
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-004-A
          given: "uma sessão configurada com modelo ou variant inexistente"
          when: "squad check é executado"
          then: "a sessão recebe fail nomeando provider modelo e variant com as variants disponíveis"
        - id: SCN-SQUAD-004-B
          given: "um valor de credencial sentinela exportado no ambiente"
          when: "squad check json é executado"
          then: "a saída não contém a sentinela e credencial aparece como present absent ou unknown"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-005
    content_ref: requirements.md#req-05--squad-plan-simula-sem-efeito
    requirement:
      id: REQ-SQUAD-005
      title: squad plan simula sem efeito
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-005-A
          given: "uma geração inicializada"
          when: "squad plan é executado"
          then: "o plano é renderizado e o digest do registro e a contagem de sessões permanecem idênticos"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-006
    content_ref: requirements.md#req-06--squad-launch-cria-adota-verifica-e-reconcilia
    requirement:
      id: REQ-SQUAD-006
      title: squad launch cria adota verifica e reconcilia
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-006-A
          given: "uma entrada creating sem session_id"
          when: "squad launch é retomado"
          then: "a sessão é criada uma única vez e a entrada avança para starting com sessão e message_id persistidos"
        - id: SCN-SQUAD-006-B
          given: "uma sessão que admitiu o marcador mas não executou"
          when: "a verificação de launch roda"
          then: "a sessão permanece starting e o erro nomeia a evidência execution ausente"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-007
    content_ref: requirements.md#req-07--squad-status-mostra-estado-e-atividade-medida
    requirement:
      id: REQ-SQUAD-007
      title: squad status mostra estado e atividade medida
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-007-A
          given: "uma geração ativa com sessões verificadas e uma fechada"
          when: "squad status json é executado"
          then: "o documento lista geração ativa sessões com atividade medida e a geração anterior em previous"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-008
    content_ref: requirements.md#req-08--squad-send-enfileira-pela-forgequeue-com-prova-de-enfileiramento
    requirement:
      id: REQ-SQUAD-008
      title: squad send enfileira pela ForgeQueue com prova de enfileiramento
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-008-A
          given: "uma sessão destino verificada e um arquivo de mensagem"
          when: "squad send é executado duas vezes com a mesma chave de idempotência"
          then: "o mesmo message_id é devolvido e existe uma única linha de inbox"
        - id: SCN-SQUAD-008-B
          given: "uma sessão destino em estado starting"
          when: "squad send é executado"
          then: "o comando falha com ConflictError nomeando o estado e squad launch"
        - id: SCN-SQUAD-008-C
          given: "o destino é a própria sessão de origem"
          when: "squad send é executado sem allow-self"
          then: "o comando falha com ForbiddenError e nada é enfileirado"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-009
    content_ref: requirements.md#req-09--squad-broadcast-valida-todos-antes-e-reporta-falha-parcial
    requirement:
      id: REQ-SQUAD-009
      title: squad broadcast valida todos antes e reporta falha parcial
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-009-A
          given: "um destinatário inválido entre os válidos"
          when: "squad broadcast é executado"
          then: "nenhum enfileiramento acontece e o relatório lista todos os inválidos"
        - id: SCN-SQUAD-009-B
          given: "todos os destinatários válidos"
          when: "squad broadcast é executado"
          then: "o resultado por destinatário é accepted rejected ou not_attempted e a origem é excluída"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-010
    content_ref: requirements.md#req-10--checkpoint-durável-com-seções-obrigatórias-e-hash
    requirement:
      id: REQ-SQUAD-010
      title: Checkpoint durável com seções obrigatórias e hash
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-010-A
          given: "um checkpoint sem a seção Posse da árvore"
          when: "squad checkpoint é executado"
          then: "o comando falha nomeando a seção ausente e nada é persistido"
        - id: SCN-SQUAD-010-B
          given: "um corpo de checkpoint normalizado"
          when: "o checkpoint é gravado"
          then: "o sha256 dos bytes normalizados é registrado e recomputável"
        - id: SCN-SQUAD-010-C
          given: "um corpo contendo uma chave privada PEM"
          when: "squad checkpoint é executado sem override"
          then: "o comando recusa nomeando linha e tipo detectado"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-011
    content_ref: requirements.md#req-11--squad-close-exige-checkpoints-e-grava-comprovante
    requirement:
      id: REQ-SQUAD-011
      title: squad close exige checkpoints e grava comprovante
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-011-A
          given: "uma geração com uma sessão sem checkpoint"
          when: "squad close é executado"
          then: "o fechamento falha listando a sessão pendente e a geração permanece active"
        - id: SCN-SQUAD-011-B
          given: "checkpoint íntegro em todas as sessões e nenhuma execução ativa"
          when: "squad close é executado"
          then: "o comprovante é gravado com digest do registro de origem e previous_orchestrator_kept_open verdadeiro"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-012
    content_ref: requirements.md#req-12--squad-transition-amarra-geração-anterior-e-nova
    requirement:
      id: REQ-SQUAD-012
      title: squad transition amarra geração anterior e nova
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-012-A
          given: "um comprovante de fechamento íntegro"
          when: "squad transition é executado para a geração ativa"
          then: "o comprovante é vinculado e repetir com o mesmo alvo é no-op"
        - id: SCN-SQUAD-012-B
          given: "registro de origem alterado após o fechamento"
          when: "squad transition é executado"
          then: "o comando falha com ConflictError e a geração nova não muda"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-013
    content_ref: requirements.md#req-13--liveness-medida-nunca-presumida
    requirement:
      id: REQ-SQUAD-013
      title: Liveness medida nunca presumida
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-013-A
          given: "stale_after de 60 minutos e última atividade às 10:00"
          when: "liveness é consultado às 11:01"
          then: "o veredito é stalled com medida e fonte declaradas"
        - id: SCN-SQUAD-013-B
          given: "uma mensagem de agente dizendo estou viva e time.updated antigo"
          when: "liveness é consultado"
          then: "o veredito é stalled e nenhum texto de agente foi lido"
        - id: SCN-SQUAD-013-C
          given: "uma sessão em working com time.busy anterior a agora menos stale_after"
          when: "liveness é consultado"
          then: "o veredito permanece working e working_stale é verdadeiro com o instante de time.busy"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-014
    content_ref: requirements.md#req-14--protocolo-de-despacho-validado
    requirement:
      id: REQ-SQUAD-014
      title: Protocolo de despacho validado
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-014-A
          given: "um despacho sem DoD e sem prova"
          when: "squad dispatch create é executado"
          then: "o comando falha nomeando todos os campos faltantes na mesma resposta"
        - id: SCN-SQUAD-014-B
          given: "base existente e head ainda não criado"
          when: "o despacho é aceito"
          then: "base_oid é gravado e validation fica unknown com motivo"
        - id: SCN-SQUAD-014-C
          given: "dois despachos concorrentes na mesma geração"
          when: "ambos são criados"
          then: "ORQ-id e seq são únicos e monotônicos sem buraco por falha"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-015
    content_ref: requirements.md#req-15--um-escritor-por-árvore
    requirement:
      id: REQ-SQUAD-015
      title: Um escritor por árvore
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-015-A
          given: "uma árvore com dono ativo diferente do alvo"
          when: "um despacho é criado para o alvo"
          then: "o comando falha nomeando dono desde quando e o comando de liberação"
        - id: SCN-SQUAD-015-B
          given: "checkpoint do dono atual com hash conferido e motivo informado"
          when: "squad release é executado"
          then: "a posse antiga é fechada e a nova é aberta na mesma transação com auditoria"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-016
    content_ref: requirements.md#req-16--squad-activate-entrega-transferência-sem-liberar-execução
    requirement:
      id: REQ-SQUAD-016
      title: squad activate entrega transferência sem liberar execução
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-016-A
          given: "todas as sessões verificadas e transição vinculada"
          when: "squad activate é executado"
          then: "a transferência é enfileirada na ORQUESTRADORA e productive permanece falso"
        - id: SCN-SQUAD-016-B
          given: "uma sessão ainda em starting"
          when: "squad activate é executado"
          then: "o comando falha listando o que falta e nada é enfileirado"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-017
    content_ref: requirements.md#req-17--painelkanban-com-evidência-por-estágio
    requirement:
      id: REQ-SQUAD-017
      title: Painel kanban com evidência por estágio
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-017-A
          given: "um card cujo estágio ci não tem fonte configurada"
          when: "squad panel build é executado"
          then: "o card traz ci unknown e progressa falso sem barra de progresso"
        - id: SCN-SQUAD-017-B
          given: "merge e aceite verificados para o head do despacho"
          when: "o painel é gerado"
          then: "a coluna reflete o estágio verificado mais avançado e done só existe com todos os estágios exigidos verificados"
        - id: SCN-SQUAD-017-C
          given: "um documento de painel gerado"
          when: "squad panel show é executado"
          then: "o resumo lista contagem por coluna e os cards com progressa falso e em desconhecido"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-018
    content_ref: requirements.md#req-18--auditoria-append-only-sem-segredo-e-sem-corpo-de-mensagem
    requirement:
      id: REQ-SQUAD-018
      title: Auditoria append-only sem segredo e sem corpo de mensagem
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-018-A
          given: "uma mensagem com sentinela de segredo no corpo"
          when: "squad send conclui"
          then: "a sentinela existe na inbox de destino e não existe em auditoria status ou checkpoint"
        - id: SCN-SQUAD-018-B
          given: "uma linha de auditoria gravada"
          when: "qualquer comando da camada é executado"
          then: "não existe operação que altere ou remova a linha"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-019
    content_ref: requirements.md#req-19--integração-por-contrato-com-forgequeue-e-subscriptionauth
    requirement:
      id: REQ-SQUAD-019
      title: Integração por contrato com ForgeQueue e SubscriptionAuth
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-019-A
          given: "um contrato de fila que devolve message_id na admissão"
          when: "o teste de contrato roda contra o servidor falso"
          then: "o adapter é aprovado e nenhum outro módulo importa a primitiva diretamente"
        - id: SCN-SQUAD-019-B
          given: "adapter de credencial devolvendo absent"
          when: "squad check é executado"
          then: "a sessão reprova sem que nenhum arquivo de credencial seja lido"
        - id: SCN-SQUAD-019-C
          given: "o SquadChannel implementado sobre Session.prompt do core"
          when: "a admissão é exercitada com delivery queue e id derivado da chave"
          then: "o retorno é prova de enfileiramento e nenhum módulo do core importa o forgequeue ou a primitiva de inbox fora do adapter"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-020
    content_ref: requirements.md#req-20--ajuda-documentação-e-demonstração-sem-credencial
    requirement:
      id: REQ-SQUAD-020
      title: Ajuda documentação e demonstração sem credencial
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-020-A
          given: "o binário instalado"
          when: "squad help é executado"
          then: "todos os subcomandos aparecem e plan e check são descritos como seguros"
        - id: SCN-SQUAD-020-B
          given: "um ambiente sem chave de API e sem rede externa"
          when: "o script de demonstração roda contra o servidor local"
          then: "ele mostra mensagem enfileirada evento de entrega checkpoint e transição"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-021
    content_ref: requirements.md#req-21--regressão-e-desligamento-limpo
    requirement:
      id: REQ-SQUAD-021
      title: Regressão e desligamento limpo
      normative: SHALL NOT
      scenarios:
        - id: SCN-SQUAD-021-A
          given: "squad.enabled false"
          when: "qualquer rota ou comando da camada é chamado"
          then: "a chamada falha sem alterar sessão inbox evento ou configuração existente"
        - id: SCN-SQUAD-021-B
          given: "a árvore do change com a suíte completa"
          when: "os testes de core protocol server e cli rodam"
          then: "queue auth prompt e inbox permanecem verdes sem mudança de expectativa"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-022
    content_ref: requirements.md#req-22--squad-dispatch-accept-produz-o-estágio-acceptance
    requirement:
      id: REQ-SQUAD-022
      title: squad dispatch accept produz o estágio acceptance
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-022-A
          given: "um despacho open na geração ativa"
          when: "squad dispatch accept é executado"
          then: "o despacho passa a accepted com accepted_at e accepted_by e auditoria dispatch_accept"
        - id: SCN-SQUAD-022-B
          given: "um despacho done ou de outra geração"
          when: "squad dispatch accept é executado"
          then: "o comando falha com ConflictError e nada muda"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-023
    content_ref: requirements.md#req-23--squad-session-replace-substitui-sessão-presa-em-starting
    requirement:
      id: REQ-SQUAD-023
      title: squad session replace substitui sessão presa em starting
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-023-A
          given: "uma sessão presa em starting por provider errado"
          when: "squad session replace é executado com novo provider"
          then: "um novo session_id é criado herdando o checkpoint e a entrada não duplica"
        - id: SCN-SQUAD-023-B
          given: "uma sessão em estado verified"
          when: "squad session replace é executado"
          then: "o comando falha nomeando o estado e nada muda"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-024
    content_ref: requirements.md#req-24--squad-block-declara-causa-de-bloqueio
    requirement:
      id: REQ-SQUAD-024
      title: squad block declara causa de bloqueio
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-024-A
          given: "uma sessão verified em working parada à espera humana"
          when: "squad block --waiting human --reason é executado"
          then: "um evento durável de bloqueio é gravado e o liveness reporta cause com waiting_on human"
        - id: SCN-SQUAD-024-B
          given: "uma sessão com bloqueio ativo"
          when: "squad block --clear é executado"
          then: "o bloqueio é removido e o cause do liveness volta a nulo"
      contracts: []
      tests: []

  - op: add_requirement
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-025
    content_ref: requirements.md#req-25--custo-e-cota-projetados-por-sessão-e-geração
    requirement:
      id: REQ-SQUAD-025
      title: Custo e cota projetados por sessão e geração
      normative: SHALL
      scenarios:
        - id: SCN-SQUAD-025-A
          given: "sessões com uso registrado"
          when: "squad status json é executado"
          then: "cost e tokens aparecem por sessão e um total por geração é somado"
        - id: SCN-SQUAD-025-B
          given: "uma credencial próxima da expiração"
          when: "squad check é executado"
          then: "expiryWarn é verdadeiro sem mudar o veredito present absent unknown"
      contracts: []
      tests: []

  - op: add_contract
    contract_type: other
    path: packages/schema/src/squad.ts
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-002

  - op: add_contract
    contract_type: other
    path: packages/schema/src/config/squad.ts
    capability: squad-orchestration
    requirement_id: REQ-SQUAD-001
