approvals:
  - gate: requirements_reviewed
    decision: approve
    autonomous: true
    reason: "Analise adversarial dos 21 REQ contra proposal §2 (13 itens) e §4: cobertura completa (registro, resolucao, canal, check/plan, launch, status/liveness, checkpoint, close/transition/activate, dispatch, dono de arvore, painel, auditoria, dependencias, docs, regressao). Cada REQ tem criterios observaveis; exemplos numericos computados (digest sha256 786d7eb4... conferido com node:crypto; limiares de liveness 10:59/11:01 coerentes com a formula). Conflitos resolvidos: idempotencia explicita em send/broadcast (dedupe por conteudo engoliria mensagem repetida), liveness sem time.updated (renomear nao e atividade), claim de shutdown reconciliado por interrupt, prova de dispatch verificavel por stoplist. Fora de escopo reafirmado sem requisito conflitante."
    decided_by: "forge-yolo (opus, high)"
    decided_at: "2026-11-04T23:58:51-03:00"
    commit: "63a8aefd98"
    scope: "requirements.md"
  - gate: design_reviewed
    decision: approve
    autonomous: true
    reason: "Design cobre os 21 REQ por secao real na tabela §7 e resolve as decisoes estruturais: servico de controle no core + grupo HTTP experimental + CLI com estado relacional (DD-01/DD-02, justificado por machinery-propagation: estado de execucao nao nasce na branch); resolucao escopada a geracao ativa e digest canonico com exemplo computado (DD-03/DD-04); canal como porta unica sobre a inbox que o ForgeQueue expoe, prova apenas de enfileiramento e idempotencia explicita (DD-05); launch write-ahead com quatro evidencias duraveis (DD-06); checkpoint/fechamento/transicao por comprovante e amarração por digest com ordem operacional coerente com o indice unico de geracao ativa (DD-07); liveness derivada de eventos e relogio (DD-08); despacho fechado com base/head medidos e dono por arvore com escopo configuravel (DD-09/DD-10); painel com evidencia por estagio e unknown obrigatorio (DD-11); flag default desligado e erros por reuso do contrato existente (DD-12). Alternativas registradas (A-G) com trade-offs. Contratos tem estrategia aditiva e portas isoladas para forgequeue/subscription-auth, com o que depende e o que nao depende do contrato estabilizado. Riscos com deteccao. Varredura de normas: api-and-contracts (/api/v1) registrada como drift da rule frente ao contrato vigente do repo; demais compativeis com motivo. Identificadores novos varridos com controle positivo (git log -S)."
    decided_by: "forge-yolo (opus, high)"
    decided_at: "2026-11-04T23:58:57-03:00"
    commit: "63a8aefd98"
    scope: "design.md"
  - gate: tasks_reviewed
    decision: approve
    autonomous: true
    reason: "31 TASK em 7 waves, dependencias so para waves anteriores (TSK-01/02/03 verificados por lib/tasks-graph.mjs na transicao), toda TASK com rastreia/paths/depende, Teste (comando) e Padrao de falha no formato de diff do runner (Expected/Received e Expected to contain), e expoe: nas 15 tasks que produzem rota para o SRF-01 fechar sem WARN. Cobertura de rastreabilidade por criterio de aceite: os 21 REQ e 6 NFR aparecem na tabela com ordinais; REQ-02 e REQ-14 atualizados para os criterios 5 e 6. Prova vermelha/verde delegada ao /forge:implement via red-evidence.sh task; nenhum gate novo em runtime.gates (canal = suite de testes do pacote no CI real). TASK-30 declara a parte documental sem par vermelho/verde, com motivo, e mantem assercao executavel de ajuda. Nenhuma task escreve em estado compartilhado sem declarar dependencia; nenhuma depende de contrato nao estabilizado fora dos adapters das TASK-10/TASK-12."
    decided_by: "forge-yolo (opus, high)"
    decided_at: "2026-11-04T23:59:02-03:00"
    commit: "63a8aefd98"
    scope: "tasks.md"
